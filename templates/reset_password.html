{% extends 'base.html' %}
{% block title %}Neues Passwort | Squalo Schwimmcoaching{% endblock %}
{% block robots_meta %}noindex, nofollow{% endblock %}
{% block content %}
  <div class="auth-form-container">
    <h2>Neues Passwort</h2>
    <form method="post">
      <div class="form-group">
        <label for="password">Neues Passwort</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" autofocus>
      </div>
      <div class="form-group">
        <label for="password_confirmation">Neues Passwort bestätigen</label>
        <input type="password" id="password_confirmation" name="password_confirmation" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Passwort speichern</button>
    </form>
  </div>
{% endblock %}
