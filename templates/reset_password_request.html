{% extends 'base.html' %}
{% block title %}Passwort zurücksetzen | Squalo Schwimmcoaching{% endblock %}
{% block robots_meta %}noindex, nofollow{% endblock %}
{% block content %}
  <div class="auth-form-container">
    <h2>Passwort zurücksetzen</h2>
    <form method="post">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary">Link zum Zurücksetzen senden</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('login') }}">Zurück zum Login</a></p>
  </div>
{% endblock %}
